<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #F6F5F1;
    --fg: #0B0D12;
    --muted: #565C68;
    --card: #FFFFFF;
    --line: rgba(11, 13, 18, 0.12);
    --navy: #14213D;
    --gold: #86652A;
    --gold-bright: #C9A961;
    --focus: #14213D;
    --serif: "Fraunces", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --sans: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B0D12; --fg: #F2F0EA; --muted: #A3A9B5; --card: #12161F;
      --line: rgba(255, 255, 255, 0.12); --gold: #C9A961; --focus: #C9A961;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B0D12; --fg: #F2F0EA; --muted: #A3A9B5; --card: #12161F;
    --line: rgba(255, 255, 255, 0.12); --gold: #C9A961; --focus: #C9A961;
  }
  html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 80px); }
  html, body { height: auto; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); line-height: 1.65; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  h1, h2, h3, .serif { font-family: var(--serif); font-optical-sizing: auto; letter-spacing: -0.015em; }
  a, button { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
  .skip { position: absolute; left: -999px; top: 8px; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 100; }
  .skip:focus { left: 12px; }

  .wrap { width: 100%; max-width: 1160px; margin: 0 auto; padding-left: 24px; padding-right: 24px; }
  .muted { color: var(--muted); }

  /* Header */
  .header { position: sticky; top: 0; z-index: 50; padding-top: env(safe-area-inset-top, 0px); background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid transparent; transition: border-color .3s ease; }
  .header.scrolled { border-bottom-color: var(--line); }
  .header-inner { display: flex; align-items: center; justify-content: space-between; height: 72px; }
  .brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; color: var(--fg); font-weight: 600; }
  .monogram { width: 38px; height: 38px; border-radius: 12px; background: var(--navy); color: #F2E7CC; display: grid; place-items: center; font-family: var(--serif); font-size: 16px; font-weight: 600; letter-spacing: 0; }
  .brand-name { font-size: 15px; }
  .nav { display: flex; align-items: center; gap: 6px; }
  .nav-link { position: relative; text-decoration: none; color: var(--muted); font-size: 15px; font-weight: 500; padding: 10px 14px; border-radius: 999px; transition: color .25s ease, background-color .25s ease; }
  .nav-link:hover { color: var(--fg); background: color-mix(in srgb, var(--fg) 6%, transparent); }
  .nav-link[aria-current="page"] { color: var(--fg); }
  .nav-link[aria-current="page"]::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 5px; height: 2px; background: var(--gold-bright); border-radius: 2px; }
  .nav-cta { text-decoration: none; font-size: 15px; font-weight: 600; padding: 10px 20px; border-radius: 999px; background: var(--fg); color: var(--bg); border: 1px solid var(--fg); transition: transform .25s ease, background-color .25s ease, color .25s ease, box-shadow .25s ease; }
  .nav-cta:hover { background: var(--navy); color: #fff; border-color: var(--navy); transform: translateY(-1px); box-shadow: 0 8px 20px -10px rgba(20,33,61,.6); }
  .nav-cta[aria-current="page"] { background: var(--navy); color: #fff; border-color: var(--navy); }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 600; font-size: 16px; padding: 15px 28px; border-radius: 999px; transition: transform .25s ease, box-shadow .25s ease, background-color .25s ease, color .25s ease, border-color .25s ease; cursor: pointer; border: 1px solid transparent; }
  .btn svg { transition: transform .25s ease; }
  .btn:hover svg { transform: translateX(4px); }
  .btn-primary { background: var(--navy); color: #fff; box-shadow: 0 14px 30px -16px rgba(20,33,61,.75); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 18px 34px -16px rgba(20,33,61,.85); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-primary { background: var(--gold-bright); color: #14213D; } }
  .btn-ghost { border-color: var(--line); color: var(--fg); background: transparent; }
  .btn-ghost:hover { border-color: var(--fg); transform: translateY(-2px); }
  .btn-ghost:hover svg { transform: translateX(-4px); }

  /* Hero */
  .hero { position: relative; padding: 48px 0 96px; }
  .hero-grid { display: grid; gap: 56px; align-items: center; grid-template-columns: 1fr; }
  @media (min-width: 900px) { .hero { padding: 72px 0 120px; } .hero-grid { grid-template-columns: 1.15fr 0.85fr; gap: 80px; } }
  .hero h1 { font-size: clamp(3rem, 8.2vw, 5.6rem); line-height: 0.98; font-weight: 500; margin: 0; }
  .hero .headline { font-family: var(--serif); font-size: clamp(1.35rem, 2.6vw, 1.85rem); line-height: 1.25; font-weight: 400; margin: 22px 0 0; max-width: 24ch; color: var(--fg); }
  .hero .lead { font-size: 1.075rem; max-width: 52ch; margin: 22px 0 0; color: var(--muted); }
  .facts { display: grid; grid-template-columns: repeat(2, minmax(0, auto)); justify-content: start; gap: 18px 56px; margin: 36px 0 0; padding: 22px 0 0; border-top: 1px solid var(--line); max-width: 460px; }
  .facts dt { font-size: 13px; color: var(--muted); margin: 0 0 4px; font-weight: 500; }
  .facts dd { margin: 0; font-family: var(--serif); font-size: 1.3rem; font-weight: 500; }
  .hero-actions { margin-top: 40px; }

  /* One orchestrated entrance */
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes settle { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
  .enter { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
  .enter-photo { opacity: 0; animation: settle 1.1s cubic-bezier(.2,.7,.2,1) .25s forwards; }
  .d1 { animation-delay: .05s; } .d2 { animation-delay: .18s; } .d3 { animation-delay: .3s; } .d4 { animation-delay: .42s; } .d5 { animation-delay: .54s; }

  /* Scroll reveal */
  .reveal { opacity: 0; transform: translateY(16px); transition: opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1); transition-delay: var(--delay, 0ms); }
  .reveal.in { opacity: 1; transform: none; }

  /* Photo */
  .photo-wrap { position: relative; width: 100%; max-width: 440px; margin: 0 auto; }
  .photo-wrap::before { content: ""; position: absolute; inset: 18px -18px -18px 18px; border: 1px solid var(--gold-bright); border-radius: 36px; opacity: .7; }
  .photo { position: relative; aspect-ratio: 4 / 5; border-radius: 32px; overflow: hidden; background: radial-gradient(120% 80% at 30% 12%, #3A4C73 0%, #1B2A4B 45%, #0F1A33 100%); box-shadow: 0 40px 80px -40px rgba(11,13,18,.55); }
  .photo::after { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 40% at 28% 8%, rgba(255,244,214,.28), transparent 70%); pointer-events: none; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo svg.sil { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 78%; height: auto; color: rgba(255,255,255,.14); }
  .photo-tag { position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 2; text-align: center; font-size: 12.5px; color: #E9E4D4; background: rgba(8,12,22,.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.14); padding: 9px 14px; border-radius: 14px; }

  /* Sections */
  .section { padding: 88px 0; }
  .section-head { max-width: 640px; margin-bottom: 44px; }
  .section-head h2 { font-size: clamp(1.9rem, 4vw, 2.7rem); line-height: 1.1; font-weight: 500; margin: 0; }
  .section-head p { margin: 14px 0 0; color: var(--muted); }
  .rule-top { border-top: 1px solid var(--line); }

  .page-title { padding: 56px 0 40px; }
  .page-title h1 { font-size: clamp(2.5rem, 6.4vw, 4.6rem); line-height: 1.02; font-weight: 500; margin: 0; max-width: 16ch; }
  .intro { font-family: var(--serif); font-size: clamp(1.2rem, 2.2vw, 1.55rem); line-height: 1.5; font-weight: 350; max-width: 46rem; margin: 28px 0 0; }

  /* Cards */
  .grid-2 { display: grid; gap: 20px; grid-template-columns: 1fr; }
  .grid-3 { display: grid; gap: 20px; grid-template-columns: 1fr; }
  @media (min-width: 720px) { .grid-2 { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 900px) { .grid-3 { grid-template-columns: repeat(3, 1fr); } }
  .card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 30px; transition: transform .35s cubic-bezier(.2,.7,.2,1), border-color .35s ease, box-shadow .35s ease; }
  .card:hover { transform: translateY(-5px); border-color: var(--gold-bright); box-shadow: 0 24px 44px -28px rgba(11,13,18,.4); }
  .card h3 { font-size: 1.4rem; font-weight: 500; margin: 20px 0 8px; }
  .card p { margin: 0; color: var(--muted); font-size: 1rem; }
  .icon-tile { width: 48px; height: 48px; border-radius: 14px; background: var(--navy); color: #F2E7CC; display: grid; place-items: center; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .badge { font-size: 12px; font-weight: 600; color: var(--gold); border: 1px solid color-mix(in srgb, var(--gold) 45%, transparent); padding: 4px 11px; border-radius: 999px; white-space: nowrap; }
  .note { margin-top: 26px; font-size: 14px; color: var(--muted); max-width: 60ch; }

  .interest { overflow: hidden; padding: 0; }
  .interest .art { height: 150px; background: linear-gradient(140deg, #14213D 0%, #22345C 100%); display: grid; place-items: center; color: #F2E7CC; position: relative; }
  .interest .art::after { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 90% at 20% 0%, rgba(201,169,97,.28), transparent 70%); }
  .interest .art svg { position: relative; z-index: 1; transition: transform .5s cubic-bezier(.2,.7,.2,1); }
  .interest:hover .art svg { transform: scale(1.1); }
  .interest .body { padding: 26px 28px 30px; }
  .interest h3 { margin: 0 0 8px; }

  .intro-sub { font-size: 1.1rem; line-height: 1.75; max-width: 46rem; margin: 22px 0 0; color: var(--muted); }

  /* Books */
  .book-head { display: flex; gap: 20px; align-items: center; }
  .book-cover { flex: none; width: 76px; aspect-ratio: 3 / 4; border-radius: 6px 10px 10px 6px; background: linear-gradient(135deg, #14213D, #22345C); color: #F2E7CC; display: grid; place-items: center; padding: 8px; text-align: center; font-family: var(--serif); font-size: 11px; line-height: 1.15; font-weight: 600; box-shadow: inset 5px 0 0 rgba(201,169,97,.55), 0 14px 24px -14px rgba(11,13,18,.6); }
  .book .author { margin: 4px 0 0; font-size: 14px; }
  .book .idea { font-family: var(--serif); font-size: 1.15rem; line-height: 1.5; color: var(--fg); margin: 24px 0 0; }
  .lessons-title { font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--gold); margin: 26px 0 10px; letter-spacing: 0; }
  .lessons { list-style: none; margin: 0; padding: 0; }
  .lessons li { padding: 13px 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.98rem; }
  .lessons li strong { color: var(--fg); font-weight: 600; }

  /* Channel */
  .channel { display: grid; border-radius: 28px; overflow: hidden; background: var(--card); border: 1px solid var(--line); transition: border-color .35s ease, box-shadow .35s ease; }
  .channel:hover { border-color: var(--gold-bright); box-shadow: 0 28px 50px -30px rgba(11,13,18,.45); }
  @media (min-width: 820px) { .channel { grid-template-columns: 0.8fr 1.2fr; } }
  .channel-art { min-height: 200px; background: linear-gradient(140deg, #0A0E1A 0%, #1B2A4B 100%); display: grid; place-items: center; position: relative; }
  .channel-art::after { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 80% at 25% 0%, rgba(201,169,97,.3), transparent 70%); }
  .play { position: relative; z-index: 1; width: 84px; height: 60px; border-radius: 18px; background: #F4F1E8; color: #0A0E1A; display: grid; place-items: center; transition: transform .4s cubic-bezier(.2,.7,.2,1); }
  .channel:hover .play { transform: scale(1.08); }
  .channel-body { padding: 36px 32px 40px; }
  .channel-body h2 { font-size: clamp(1.9rem, 4vw, 2.6rem); line-height: 1.1; font-weight: 500; margin: 0; }
  .channel-body p { color: var(--muted); margin: 14px 0 0; max-width: 54ch; }
  .chips { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 0; padding: 0; }
  .chips li { font-size: 13px; font-weight: 500; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); }
  .channel-body .btn { margin-top: 28px; }

  /* Values */
  .values { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .values li { display: grid; gap: 4px 32px; padding: 26px 8px; border-bottom: 1px solid var(--line); transition: background-color .3s ease, padding-left .3s ease; }
  .values li:hover { background: color-mix(in srgb, var(--fg) 3%, transparent); padding-left: 18px; }
  @media (min-width: 720px) { .values li { grid-template-columns: 240px 1fr; align-items: baseline; } }
  .values .v-name { font-family: var(--serif); font-size: 1.7rem; font-weight: 500; }
  .values .v-text { color: var(--muted); font-size: 1.05rem; }

  /* Vision */
  .vision { display: grid; gap: 28px; }
  @media (min-width: 900px) { .vision { grid-template-columns: 0.9fr 1.1fr; gap: 72px; align-items: start; } }
  .vision h2 { font-size: clamp(1.9rem, 4vw, 2.7rem); line-height: 1.1; font-weight: 500; margin: 0; }
  .vision p { font-family: var(--serif); font-size: clamp(1.15rem, 2vw, 1.4rem); line-height: 1.6; font-weight: 350; margin: 0; }

  /* Quote */
  .quote-band { background: #0A0E1A; color: #F4F1E8; padding: 120px 0; text-align: center; position: relative; overflow: hidden; }
  .quote-band::before { content: ""; position: absolute; inset: 0; background: radial-gradient(50% 70% at 50% 0%, rgba(201,169,97,.16), transparent 70%); }
  .quote-band .inner { position: relative; }
  .quote-band blockquote { margin: 0; }
  .quote-band .q { font-family: var(--serif); font-weight: 500; font-size: clamp(2.8rem, 11vw, 8rem); line-height: 1; letter-spacing: 0.01em; margin: 0; }
  .quote-band .bar { width: 64px; height: 2px; background: var(--gold-bright); margin: 36px auto 0; }
  .quote-band cite { display: block; margin-top: 18px; font-style: normal; font-size: 15px; color: #B9B7AE; }

  .back-row { padding: 56px 0 24px; }

  /* Footer */
  .footer { border-top: 1px solid var(--line); padding: 36px 0 48px; }
  .footer-inner { display: flex; flex-direction: column; gap: 6px; }
  @media (min-width: 720px) { .footer-inner { flex-direction: row; justify-content: space-between; align-items: center; } }
  .footer .name { font-weight: 600; font-size: 15px; }
  .footer .tag { color: var(--muted); font-size: 15px; font-family: var(--serif); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0ms !important; transition-duration: .001ms !important; }
    .enter, .enter-photo, .reveal { opacity: 1 !important; transform: none !important; }
  }
  @media (max-width: 480px) {
    .brand-name { display: none; }
    .wrap { padding-left: 20px; padding-right: 20px; }
    .card { padding: 26px; }
    .section { padding: 64px 0; }
    .quote-band { padding: 88px 0; }
  }
</style>

    return html`<svg width=${size} height=${size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">${(ICONS[props.name] || []).map(function (p, i) { return React.cloneElement(p, { key: i }); })}</svg>`;
  }
  function Arrow(props) {
    return html`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">${props.back ? html`<path d="M19 12H5M11 6l-6 6 6 6"/>` : html`<path d="M5 12h14M13 6l6 6-6 6"/>`}</svg>`;
  }

  /* ============================================================
     Routing (hash based, so it works on any static host)
     ============================================================ */
  function currentRoute() {
    var h = window.location.hash.replace(/^#/, "");
    return h.indexOf("/about") === 0 ? "about" : "home";
  }
  function useRoute() {
    var s = useState(currentRoute()), route = s[0], setRoute = s[1];
    useEffect(function () {
      function onChange() { setRoute(currentRoute()); }
      window.addEventListener("hashchange", onChange);
      return function () { window.removeEventListener("hashchange", onChange); };
    }, []);
    return route;
  }

  /* ============================================================
     Reveal on scroll
     ============================================================ */
  function Reveal(props) {
    var ref = useRef(null);
    useEffect(function () {
      var el = ref.current;
      if (!el) return;
      if (!("IntersectionObserver" in window)) { el.classList.add("in"); return; }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
        });
      }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
      io.observe(el);
      return function () { io.disconnect(); };
    }, []);
    var Tag = props.as || "div";
    return React.createElement(Tag, { ref: ref, className: "reveal " + (props.className || ""), style: { "--delay": (props.delay || 0) + "ms" } }, props.children);
  }

  /* ============================================================
     Layout pieces
     ============================================================ */
  function Header(props) {
    var s = useState(false), scrolled = s[0], setScrolled = s[1];
    useEffect(function () {
      function onScroll() { setScrolled(window.scrollY > 8); }
      onScroll();
      window.addEventListener("scroll", onScroll, { passive: true });
      return function () { window.removeEventListener("scroll", onScroll); };
    }, []);
    var r = props.route;
    return html`
      <header className=${"header" + (scrolled ? " scrolled" : "")}>
        <div className="wrap header-inner">
          <a href="#/" className="brand" aria-label="Matthew Setiady, go to Home">
            <span className="monogram" aria-hidden="true">MS</span>
            <span className="brand-name">Matthew Setiady</span>
          </a>
          <nav className="nav" aria-label="Main">
            <a href="#/" className="nav-link" aria-current=${r === "home" ? "page" : undefined}>Home</a>
            <a href="#/about" className="nav-cta" aria-current=${r === "about" ? "page" : undefined}>About Me</a>
          </nav>
        </div>
      </header>`;
  }

  function Footer() {
    return html`
      <footer className="footer">
        <div className="wrap footer-inner">
          <span className="name">Matthew Setiady | Personal Portfolio</span>
          <span className="tag">Growing with purpose. Guided by faith.</span>
        </div>
      </footer>`;
  }

  function Photo() {
    return html`
      <div className="photo-wrap">
        <div className="photo">
          ${PHOTO_URL
            ? html`<img src=${PHOTO_URL} alt="Matthew Setiady taking a selfie on a bridge" width="880" height="1100" />`
            : html`
              <svg className="sil" viewBox="0 0 200 220" fill="currentColor" aria-hidden="true">
                <circle cx="100" cy="72" r="40"/>
                <path d="M10 220c0-52 40-84 90-84s90 32 90 84z"/>
              </svg>
              <div className="photo-tag" role="note">Photo placeholder. Replace it with Matthew\u2019s own photo.</div>`}
        </div>
      </div>`;
  }

  /* ============================================================
     Pages
     ============================================================ */
  function Home() {
    return html`
      <section className="hero">
        <div className="wrap hero-grid">
          <div>
            <h1 className="enter d1">${PROFILE.name}</h1>
            <p className="headline enter d2">${PROFILE.headline}</p>
            <p className="lead enter d3">${PROFILE.lead}</p>
            <dl className="facts enter d4">
              <div><dt>Hobby</dt><dd>${PROFILE.hobby}</dd></div>
              <div><dt>Personal quote</dt><dd>\u201C${PROFILE.quote}\u201D</dd></div>
            </dl>
            <div className="hero-actions enter d5">
              <a href="#/about" className="btn btn-primary">Discover My Story <${Arrow} /></a>
            </div>
          </div>
          <div className="enter-photo"><${Photo} /></div>
        </div>
      </section>`;
  }

  function About() {
    return html`
      <div>
        <section className="page-title">
          <div className="wrap">
            <h1 className="enter d1">About Me \u2014 My Journey, My Growth.</h1>
            <div className="enter d2">
              ${ABOUT_INTRO.map(function (para, i) { return html`<p key=${i} className=${i === 0 ? "intro" : "intro-sub"}>${para}</p>`; })}
            </div>
          </div>
        </section>

        <section className="section rule-top" aria-labelledby="ach">
          <div className="wrap">
            <${Reveal} className="section-head">
              <h2 id="ach">My Achievements</h2>
              <p>A journey that keeps growing, not a list of finished awards.</p>
            <//>
            <div className="grid-2">
              ${ACHIEVEMENTS.map(function (a, i) {
                return html`
                  <${Reveal} key=${a.title} delay=${i * 90}>
                    <article className="card" style=${{ height: "100%" }}>
                      <div className="card-top">
                        <span className="icon-tile"><${Icon} name=${a.icon} /></span>
                        <span className="badge">Ongoing</span>
                      </div>
                      <h3>${a.title}</h3>
                      <p>${a.text}</p>
                    </article>
                  <//>`;
              })}
            </div>
            <${Reveal}><p className="note">These cards are updated as new milestones, projects, and lessons are added.</p><//>
          </div>
        </section>

        <section className="section rule-top" aria-labelledby="int">
          <div className="wrap">
            <${Reveal} className="section-head">
              <h2 id="int">My Interests</h2>
            <//>
            <div className="grid-3">
              ${INTERESTS.map(function (it, i) {
                return html`
                  <${Reveal} key=${it.title} delay=${i * 90}>
                    <article className="card interest" style=${{ height: "100%" }}>
                      <div className="art"><${Icon} name=${it.icon} size=${64} /></div>
                      <div className="body">
                        <h3>${it.title}</h3>
                        <p>${it.text}</p>
                      </div>
                    </article>
                  <//>`;
              })}
            </div>
          </div>
        </section>

        <section className="section rule-top" aria-labelledby="books">
          <div className="wrap">
            <${Reveal} className="section-head">
              <h2 id="books">Books That Shape Me</h2>
              <p>Two books I keep coming back to, and what they mean for an ordinary day.</p>
            <//>
            <div className="grid-2">
              ${BOOKS.map(function (b, i) {
                return html`
                  <${Reveal} key=${b.title} delay=${i * 100}>
                    <article className="card book" style=${{ height: "100%" }}>
                      <div className="book-head">
                        <div className="book-cover" aria-hidden="true"><span>${b.title}</span></div>
                        <div>
                          <h3 style=${{ margin: 0 }}>${b.title}</h3>
                          <p className="author">by ${b.author}</p>
                        </div>
                      </div>
                      <p className="idea">${b.idea}</p>
                      <h4 className="lessons-title">Daily-life lessons</h4>
                      <ul className="lessons">
                        ${b.lessons.map(function (l) {
                          return html`<li key=${l.h}><strong>${l.h}.</strong> ${l.t}</li>`;
                        })}
                      </ul>
                    </article>
                  <//>`;
              })}
            </div>
          </div>
        </section>

        <section className="section rule-top" aria-labelledby="yt">
          <div className="wrap">
            <${Reveal}>
              <div className="channel">
                <div className="channel-art" aria-hidden="true">
                  <span className="play"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>
                </div>
                <div className="channel-body">
                  <h2 id="yt">${CHANNEL.name}</h2>
                  <p>${CHANNEL.text}</p>
                  <ul className="chips" aria-label="Channel topics">
                    ${CHANNEL.tags.map(function (t) { return html`<li key=${t}>${t}</li>`; })}
                  </ul>
                  ${YOUTUBE_URL ? html`<a href=${YOUTUBE_URL} className="btn btn-primary" target="_blank" rel="noopener noreferrer">Visit the channel <${Arrow} /></a>` : null}
                </div>
              </div>
            <//>
          </div>
        </section>

        <section className="section rule-top" aria-labelledby="val">
          <div className="wrap">
            <${Reveal} className="section-head">
              <h2 id="val">My Values</h2>
              <p>The principles I want to hold on to, in every season.</p>
            <//>
            <${Reveal}>
              <ul className="values">
                ${VALUES.map(function (v) {
                  return html`<li key=${v.name}><span className="v-name">${v.name}</span><span className="v-text">${v.text}</span></li>`;
                })}
              </ul>
            <//>
          </div>
        </section>

        <section className="section rule-top" aria-labelledby="vis">
          <div className="wrap">
            <${Reveal} className="vision">
              <h2 id="vis">The Person I Aspire to Become.</h2>
              <p>My goal is not simply to achieve success, but to become someone who uses knowledge, discipline, and opportunities to create meaningful value for others. I want to keep learning, challenge my limitations, and grow into a person who can make a positive impact on the world.</p>
            <//>
          </div>
        </section>

        <section className="quote-band" aria-label="Personal quote">
          <div className="wrap inner">
            <${Reveal}>
              <blockquote>
                <p className="q">TRUST IN GOD.</p>
                <div className="bar" aria-hidden="true"></div>
                <cite>Matthew Setiady\u2019s personal quote</cite>
              </blockquote>
            <//>
          </div>
        </section>

        <div className="wrap back-row">
          <a href="#/" className="btn btn-ghost"><${Arrow} back=${true} /> Back to Home</a>
        </div>
      </div>`;
  }

  /* ============================================================
     App
     ============================================================ */
  function App() {
    var route = useRoute();
    var mainRef = useRef(null);
    var first = useRef(true);
    useEffect(function () {
      document.title = (route === "about" ? "About Me | " : "") + "Matthew Setiady | Personal Portfolio";
      window.scrollTo(0, 0);
      if (first.current) { first.current = false; return; }
      if (mainRef.current) mainRef.current.focus({ preventScroll: true });
    }, [route]);
    return html`
      <${React.Fragment}>
        <${Header} route=${route} />
        <main id="main" tabIndex="-1" ref=${mainRef} style=${{ outline: "none" }}>
          ${route === "about" ? html`<${About} key="about" />` : html`<${Home} key="home" />`}
        </main>
        <${Footer} />
      <//>`;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
})();
</script>
</body>
</html>
